plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv('YARUS_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('YARUS_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('YARUS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('YARUS_KEY_PASSWORD')

android {
    namespace 'ru.viktortown.yarus'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.viktortown.yarus'
        minSdk 24
        targetSdk 36
        versionCode 2026092401
        versionName '1.2.0'
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'ru.rustore.sdk:review:10.5.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseStoreFile || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
            throw new GradleException('Release signing variables YARUS_KEYSTORE_* are required.')
        }
    }
}
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    dependsOn tasks.named('verifyReleaseSigning')
}
